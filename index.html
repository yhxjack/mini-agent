<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Agent</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
         background: #0f1115; color: #e6e6e6; height: 100vh; }
  #app { display: flex; height: 100vh; }
  #side { width: 260px; flex-shrink: 0; background: #12151b; border-right: 1px solid #222832;
          display: flex; flex-direction: column; overflow: hidden; }
  .side-hd { padding: 12px 14px; font-weight: 600; display: flex; align-items: center;
             justify-content: space-between; border-bottom: 1px solid #222832; }
  .side-hd button, .ws-add { background: #222832; color: #cbd5e1; border: 0; border-radius: 6px;
             width: 24px; height: 24px; cursor: pointer; font-size: 15px; line-height: 1; }
  #wsTree { flex: 1; overflow-y: auto; padding: 6px 0; }
  .ws { margin-bottom: 2px; }
  .ws-hd { display: flex; align-items: center; gap: 4px; padding: 7px 12px; cursor: pointer;
           color: #cbd5e1; font-weight: 500; }
  .ws-hd:hover { background: #171b22; }
  .ws-hd .tw { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess { padding: 7px 12px 7px 30px; cursor: pointer; display: flex; align-items: baseline;
          gap: 8px; color: #aeb6c2; font-size: 13px; }
  .sess:hover { background: #171b22; }
  .sess.cur { background: #1d2733; color: #fff; }
  .sess .st { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .sa { color: #6b7280; font-size: 11px; flex-shrink: 0; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 12px 16px; background: #171a21; border-bottom: 1px solid #262b36; font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 820px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .user { align-self: flex-end; background: #2b5278; }
  .assistant { align-self: flex-start; background: #1e232c; }
  .tool { align-self: flex-start; background: #14240f; border: 1px solid #2d5a1e; font-family: ui-monospace, monospace; font-size: 13px; }
  .tool .hd { color: #8bd16a; cursor: pointer; }
  .tool pre { margin: 6px 0 0; max-height: 220px; overflow: auto; white-space: pre-wrap; }
  .err { align-self: flex-start; background: #3a1416; border: 1px solid #7a2a2a; color: #ffb3b3; }
  footer { padding: 12px 16px; background: #171a21; border-top: 1px solid #262b36; display: flex; gap: 8px; }
  #inp { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #0f1115; color: #e6e6e6; font-size: 14px; }
  #send { padding: 10px 18px; border: 0; border-radius: 8px; background: #2b5278; color: #fff; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  .approval { align-self: flex-start; background: #2a2410; border: 1px solid #6b5a1e; color: #f0e6c0; font-size: 13px; }
  .approval .cmd { font-family: ui-monospace, monospace; margin: 6px 0; white-space: pre-wrap; word-break: break-all; }
  .approval button { margin-right: 8px; padding: 5px 12px; border: 0; border-radius: 6px; cursor: pointer; }
  .approval .ok { background: #2d7a3e; color: #fff; }
  .approval .no { background: #7a2a2a; color: #fff; }
  .approval .st { margin-top: 4px; color: #9aa4b2; }
  #login { position: fixed; inset: 0; background: #0f1115; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #login .card { background: #171a21; border: 1px solid #262b36; border-radius: 12px; padding: 28px; width: 320px; }
  #login h2 { margin: 0 0 16px; font-size: 18px; }
  #login input { width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #0f1115; color: #e6e6e6; font-size: 14px; }
  #login .row { display: flex; gap: 8px; margin-top: 6px; }
  #login button { flex: 1; padding: 10px; border: 0; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #login .primary { background: #2b5278; color: #fff; }
  #login .ghost { background: #222832; color: #cbd5e1; }
  #login .lerr { color: #ffb3b3; font-size: 13px; min-height: 18px; margin-top: 6px; }
  #logout { float: right; font-weight: 400; font-size: 12px; background: #222832; color: #cbd5e1; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; margin-left: 10px; }
  #userlabel { float: right; font-weight: 400; color: #8b93a1; font-size: 12px; margin-left: 10px; }
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h2 id="ltitle">登录</h2>
    <input id="lu" placeholder="用户名" autocomplete="username">
    <input id="lp" type="password" placeholder="密码" autocomplete="current-password">
    <div class="row">
      <button class="primary" id="lbtn">登录</button>
      <button class="ghost" id="ltoggle">去注册</button>
    </div>
    <div class="lerr" id="lerr"></div>
  </div>
</div>
<div id="app" style="display:none">
  <aside id="side">
    <div class="side-hd">工作区 <button id="newWs" title="新建工作区">+</button></div>
    <div id="wsTree"></div>
  </aside>
  <main id="main">
    <header>Mini-Agent
      <button id="logout">登出</button><span id="userlabel"></span>
      <span id="sid" style="float:right;font-weight:400;color:#6b7280;font-size:12px"></span>
    </header>
    <div id="log"></div>
    <footer>
      <input id="inp" placeholder="输入任务,回车发送…" autocomplete="off">
      <button id="send">发送</button>
    </footer>
  </main>
</div>
<!-- H1 -->
<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const send = document.getElementById('send');
const wsTree = document.getElementById('wsTree');
const sidLabel = document.getElementById('sid');
let tree = null, curSid = null, es = null, curAsst = null, lastToolPre = null;
const expanded = {};   // wid -> bool

function ago(ts){
  const d = Date.now()/1000 - (ts||0);
  if(d < 60) return '刚刚';
  if(d < 3600) return (d/60|0) + '分钟';
  if(d < 86400) return (d/3600|0) + '小时';
  if(d < 2592000) return (d/86400|0) + '天';
  return (d/2592000|0) + '个月';
}
function add(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text || '';
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function addTool(name, args){
  const d = document.createElement('div'); d.className = 'msg tool';
  const hd = document.createElement('div'); hd.className = 'hd';
  hd.textContent = '> 工具 ' + name + ' ' + JSON.stringify(args);
  const pre = document.createElement('pre'); pre.style.display = 'none';
  hd.onclick = () => { pre.style.display = pre.style.display === 'none' ? 'block' : 'none'; };
  d.appendChild(hd); d.appendChild(pre);
  log.appendChild(d); log.scrollTop = log.scrollHeight; return pre;
}
function renderMessages(msgs){
  log.innerHTML = ''; curAsst = null; lastToolPre = null;
  const byId = {};
  for(const m of msgs){
    if(m.role === 'system') continue;
    if(m.role === 'user'){ add('user', m.content || ''); }
    else if(m.role === 'assistant'){
      if(m.content) add('assistant', m.content);
      for(const tc of (m.tool_calls || [])){
        let a = {}; try { a = JSON.parse(tc.function.arguments || '{}'); } catch(e){}
        byId[tc.id] = addTool(tc.function.name, a);
      }
    } else if(m.role === 'tool'){
      const pre = byId[m.tool_call_id];
      if(pre) pre.textContent = m.content || '';
      else { const p = addTool('result', {}); p.textContent = m.content || ''; }
    }
  }
}
function setBusy(b){ send.disabled = b; inp.disabled = b; }
function addApproval(data){
  const d = document.createElement('div'); d.className = 'msg approval';
  const title = document.createElement('div');
  title.textContent = '需要审批:执行命令 ' + data.name;
  const cmd = document.createElement('div'); cmd.className = 'cmd';
  cmd.textContent = (data.args && data.args.command) || JSON.stringify(data.args);
  const bar = document.createElement('div');
  const ok = document.createElement('button'); ok.className = 'ok'; ok.textContent = '允许';
  const no = document.createElement('button'); no.className = 'no'; no.textContent = '拒绝';
  const st = document.createElement('div'); st.className = 'st';
  function decide(decision){
    ok.disabled = no.disabled = true;
    st.textContent = decision === 'allow' ? '已允许,执行中…' : '已拒绝';
    fetch('/api/approve?request_id=' + encodeURIComponent(data.request_id) +
          '&decision=' + decision, {method:'POST'});
  }
  ok.onclick = () => decide('allow');
  no.onclick = () => decide('deny');
  bar.appendChild(ok); bar.appendChild(no);
  d.appendChild(title); d.appendChild(cmd); d.appendChild(bar); d.appendChild(st);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
<!-- H2 -->
function renderTree(){
  wsTree.innerHTML = '';
  for(const w of tree.workspaces){
    if(expanded[w.id] === undefined) expanded[w.id] = true;
    const box = document.createElement('div'); box.className = 'ws';
    const hd = document.createElement('div'); hd.className = 'ws-hd';
    const tw = document.createElement('span'); tw.className = 'tw';
    tw.textContent = (expanded[w.id] ? '▾ ' : '▸ ') + w.name;
    const addBtn = document.createElement('button'); addBtn.className = 'ws-add';
    addBtn.textContent = '+'; addBtn.title = '在此工作区新建会话';
    addBtn.onclick = (e) => { e.stopPropagation(); newSession(w.id); };
    hd.appendChild(tw); hd.appendChild(addBtn);
    hd.onclick = () => { expanded[w.id] = !expanded[w.id]; renderTree(); };
    box.appendChild(hd);
    if(expanded[w.id]){
      const ss = [...w.sessions].sort((a,b) => (b.updated||0) - (a.updated||0));
      for(const s of ss){
        const row = document.createElement('div');
        row.className = 'sess' + (s.id === curSid ? ' cur' : '');
        const st = document.createElement('span'); st.className = 'st'; st.textContent = s.title || '未命名';
        const sa = document.createElement('span'); sa.className = 'sa'; sa.textContent = ago(s.updated);
        row.appendChild(st); row.appendChild(sa);
        row.onclick = () => selectSession(s.id);
        box.appendChild(row);
      }
    }
    wsTree.appendChild(box);
  }
}
async function loadTree(){
  tree = await (await fetch('/api/workspaces')).json();
  renderTree();
}
function hasSession(sid){
  if(!tree) return false;
  return tree.workspaces.some(w => w.sessions.some(s => s.id === sid));
}
async function selectSession(sid){
  curSid = sid; localStorage.setItem('lastSessionId', sid);
  sidLabel.textContent = 'session ' + sid.slice(0, 10);
  renderTree();
  const msgs = await (await fetch('/api/session/' + encodeURIComponent(sid))).json();
  renderMessages(msgs);
  inp.focus();
}
async function newWorkspace(){
  const name = (prompt('工作区名称', '新工作区') || '').trim();
  if(!name) return;
  await fetch('/api/workspaces', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name})});
  await loadTree();
}
async function newSession(wid){
  const r = await fetch('/api/workspaces/' + encodeURIComponent(wid) + '/sessions', {method:'POST'});
  const sid = (await r.json()).session_id;
  expanded[wid] = true;
  await loadTree();
  await selectSession(sid);
}
function run(){
  const msg = inp.value.trim();
  if(!msg || !curSid) return;
  add('user', msg); inp.value = ''; setBusy(true); curAsst = null; lastToolPre = null;
  es = new EventSource('/api/chat?session_id=' + encodeURIComponent(curSid) +
                       '&message=' + encodeURIComponent(msg));
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if(ev.type === 'token'){ if(!curAsst) curAsst = add('assistant',''); curAsst.textContent += ev.data; log.scrollTop = log.scrollHeight; }
    else if(ev.type === 'tool_call'){ lastToolPre = addTool(ev.data.name, ev.data.args); curAsst = null; }
    else if(ev.type === 'approval_request'){ addApproval(ev.data); curAsst = null; }
    else if(ev.type === 'tool_result'){ if(lastToolPre) lastToolPre.textContent = ev.data.result; }
    else if(ev.type === 'final'){ if(ev.data && !curAsst) add('assistant', ev.data); curAsst = null; }
    else if(ev.type === 'error'){ add('err', '错误: ' + ev.data); }
    else if(ev.type === 'done'){ es.close(); setBusy(false); loadTree(); inp.focus(); }
  };
  es.onerror = () => { es.close(); setBusy(false); inp.focus(); };
}
async function init(){
  await loadTree();
  if(!tree.workspaces.length){   // 新用户零工作区:自动建默认工作区,避免无会话
    await fetch('/api/workspaces', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:'默认工作区'})});
    await loadTree();
  }
  const last = localStorage.getItem('lastSessionId');
  if(last && hasSession(last)){ await selectSession(last); return; }
  // 回退:选最近会话;都没有则在第一个工作区建一个
  let newest = null;
  for(const w of tree.workspaces) for(const s of w.sessions)
    if(!newest || (s.updated||0) > (newest.updated||0)) newest = s;
  if(newest){ await selectSession(newest.id); }
  else if(tree.workspaces[0]){ await newSession(tree.workspaces[0].id); }
}
document.getElementById('newWs').onclick = newWorkspace;
send.onclick = run;
inp.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); run(); } });

// ---------- 认证 ----------
let mode = 'login';
const lv = {
  u: document.getElementById('lu'), p: document.getElementById('lp'),
  err: document.getElementById('lerr'), title: document.getElementById('ltitle'),
  btn: document.getElementById('lbtn'), toggle: document.getElementById('ltoggle'),
  box: document.getElementById('login')
};
function showLogin(){ lv.box.style.display = 'flex'; document.getElementById('app').style.display = 'none'; }
function showApp(username){
  lv.box.style.display = 'none'; document.getElementById('app').style.display = 'flex';
  document.getElementById('userlabel').textContent = username;
}
lv.toggle.onclick = () => {
  mode = mode === 'login' ? 'register' : 'login';
  lv.title.textContent = mode === 'login' ? '登录' : '注册';
  lv.btn.textContent = mode === 'login' ? '登录' : '注册';
  lv.toggle.textContent = mode === 'login' ? '去注册' : '去登录';
  lv.err.textContent = '';
};
async function submitAuth(){
  const u = lv.u.value.trim(), p = lv.p.value;
  if(!u || !p){ lv.err.textContent = '请输入用户名和密码'; return; }
  lv.btn.disabled = true;
  try {
    const r = await fetch('/api/' + mode, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: u, password: p})});
    if(!r.ok){ const d = await r.json().catch(() => ({})); lv.err.textContent = d.detail || ('失败 ' + r.status); return; }
    const d = await r.json();
    showApp(d.username); await init();
  } finally { lv.btn.disabled = false; }
}
lv.btn.onclick = submitAuth;
lv.p.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); submitAuth(); } });
async function doLogout(){
  await fetch('/api/logout', {method:'POST'});
  tree = null; curSid = null; wsTree.innerHTML = ''; log.innerHTML = '';
  showLogin();
}
document.getElementById('logout').onclick = doLogout;
async function boot(){
  const r = await fetch('/api/me');
  if(r.ok){ const d = await r.json(); showApp(d.username); await init(); }
  else { showLogin(); }
}
boot();
</script>
</body>
</html>
